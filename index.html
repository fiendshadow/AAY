<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <title>Quran Hifz Master</title>
    <!-- Подключаем шрифты для красоты и арабского языка -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS VARIABLES & THEME --- */
        :root {
            --primary: #10b981;
            --primary-dark: #047857;
            --accent: #f59e0b;
            --bg: #f0fdf4;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-sec: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --font-main: 'Inter', sans-serif;
            --font-ar: 'Amiri', serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --surface: #1f2937;
                --text-main: #f9fafb;
                --text-sec: #9ca3af;
                --border: #374151;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            transition: background 0.3s ease;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        body[dir="rtl"] { font-family: var(--font-ar); }

        /* --- LAYOUT COMPONENTS --- */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
        }

        .logo {
            font-weight: 800;
            font-size: 22px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-icon {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .btn-icon:active { transform: scale(0.9); }

        /* Quote Box */
        .quote-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: height 0.3s ease, opacity 0.3s ease;
        }
        
        .quote-card.hidden { display: none; }
        
        .quote-text {
            font-size: 15px;
            line-height: 1.6;
            position: relative;
            z-index: 2;
            font-style: italic;
        }
        
        .quote-bg-icon {
            position: absolute;
            right: -10px;
            bottom: -20px;
            font-size: 100px;
            opacity: 0.1;
            transform: rotate(-15deg);
        }

        /* Progress Bar */
        .progress-block {
            margin-bottom: 30px;
        }
        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-sec);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .progress-track {
            height: 10px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Day Cards */
        .day-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .day-card.completed {
            opacity: 0.6;
            filter: grayscale(0.8);
        }
        .day-card.active-day {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 18px;
        }

        .task-row {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .task-row:active { background: var(--bg); }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--text-sec);
            border-radius: 8px;
            margin-inline-end: 15px; /* Supports RTL */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .task-row.checked .checkbox {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            animation: bounce 0.4s;
        }

        .task-row.checked .task-desc {
            text-decoration: line-through;
            color: var(--text-sec);
        }

        .task-meta { flex-grow: 1; }
        .task-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
        }
        .task-desc { font-weight: 500; font-size: 15px; }

        /* Colors for task types */
        .type-manzil { color: #d97706; }
        .type-sabki { color: #0284c7; }
        .type-sabak { color: #059669; }

        /* --- MODAL / SETTINGS --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: flex-end; /* Bottom sheet on mobile */
        }
        
        .modal-overlay.open { display: flex; animation: fadeIn 0.3s; }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: 24px 24px 0 0;
            padding: 30px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @media(min-width: 600px) {
            .modal-overlay { align-items: center; }
            .modal-content { border-radius: 24px; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .modal-title { font-size: 20px; font-weight: 800; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-sec); }
        
        select, input {
            width: 100%;
            padding: 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 16px;
            font-family: inherit;
        }

        .btn-full {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--bg); color: var(--text-main); margin-top: 10px; }
        .btn-full:active { transform: scale(0.98); }

        .lang-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .lang-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: 8px;
            cursor: pointer;
        }
        .lang-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        /* Animations */
        @keyframes bounce { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    </style>
</head>
<body>

<!-- APP CONTAINER -->
<div class="container" id="mainApp" style="display:none;">
    <header>
        <div class="logo">QuranPlan</div>
        <button class="btn-icon" onclick="openSettings()">⚙️</button>
    </header>

    <!-- Цитата -->
    <div class="quote-card" id="quoteCard">
        <div class="quote-bg-icon">📖</div>
        <div class="quote-text" id="quoteText">...</div>
    </div>

    <!-- Прогресс -->
    <div class="progress-block">
        <div class="progress-labels">
            <span id="progressLabel">Прогресс</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- Список дней -->
    <div id="scheduleList"></div>
</div>

<!-- SETUP / SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">Настройки</span>
            <button class="btn-icon" onclick="closeSettings()" style="width:30px; height:30px;">✕</button>
        </div>

        <!-- Язык -->
        <div class="form-group">
            <label class="form-label" id="lblLang">Язык / Language</label>
            <div class="lang-switcher">
                <button class="lang-btn" onclick="setLang('ru')" id="btnRu">Рус</button>
                <button class="lang-btn" onclick="setLang('en')" id="btnEn">Eng</button>
                <button class="lang-btn" onclick="setLang('ar')" id="btnAr" style="font-family:'Amiri'">عربي</button>
            </div>
        </div>

        <!-- Переключатели -->
        <div class="toggle-row">
            <span id="lblQuotes">Показывать цитаты о Коране</span>
            <input type="checkbox" id="toggleQuotes" onchange="toggleQuotes(this.checked)" checked style="width:auto;">
        </div>

        <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">

        <h3 id="lblPlanHeader" style="margin-top:0">Параметры плана</h3>
        
        <div class="form-group">
            <label class="form-label" id="lblStartPage">Стартовая страница</label>
            <input type="number" id="inpStartPage" value="1" min="1" max="604">
        </div>

        <div class="form-group">
            <label class="form-label" id="lblPace">Темп изучения (в день)</label>
            <select id="inpPace">
                <option value="3">3 строки (Lines)</option>
                <option value="5">5 строк (Lines)</option>
                <option value="7">7 строк (Lines)</option>
                <option value="0.5">Половина страницы (1/2 Page)</option>
                <option value="1">Целая страница (1 Page)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" id="lblDuration">Длительность плана</label>
            <select id="inpDuration">
                <option value="7">1 неделя (7 days)</option>
                <option value="14">2 недели (14 days)</option>
                <option value="30">1 месяц (30 days)</option>
                <option value="60">2 месяца (60 days)</option>
            </select>
        </div>

        <button class="btn-full btn-primary" onclick="generatePlan()" id="btnGenerate">Создать / Обновить план</button>
        <p style="font-size:12px; color:var(--danger); text-align:center; margin-top:10px;" id="lblWarning">Внимание: Это сбросит текущие галочки!</p>
    </div>
</div>

<script>
    // --- DICTIONARY (TRANSLATIONS) ---
    const i18n = {
        ru: {
            title: "QuranPlan",
            progress: "Прогресс",
            lblLang: "Язык приложения",
            lblQuotes: "Мотивация и Хадисы",
            lblPlanHeader: "Настройки плана",
            lblStartPage: "С какой страницы начать?",
            lblPace: "Объем в день",
            lblDuration: "На сколько дней план?",
            btnGenerate: "Создать новый план",
            lblWarning: "⚠️ Создание нового плана удалит текущий прогресс!",
            modalTitle: "Настройки",
            days: "День",
            manzil: "Манзиль (Архив)",
            sabki: "Сабки (Связка)",
            sabak: "Сабак (Новое)",
            optLines: "строк",
            optHalf: "Половина стр.",
            optFull: "Целая стр.",
            optWeek: "неделя",
            optMonth: "месяц",
            quotes: [
                "Лучший из вас тот, кто изучает Коран и обучает ему других.",
                "Читай Коран, ибо в Судный день он придет заступником.",
                "Сердце без Корана подобно разрушенному дому.",
                "Коран — это свет на земле и запас на небесах."
            ]
        },
        en: {
            title: "QuranPlan",
            progress: "Progress",
            lblLang: "Language",
            lblQuotes: "Show Quotes",
            lblPlanHeader: "Plan Settings",
            lblStartPage: "Starting Page",
            lblPace: "Daily Pace",
            lblDuration: "Duration",
            btnGenerate: "Generate New Plan",
            lblWarning: "⚠️ Generating a new plan will reset progress!",
            modalTitle: "Settings",
            days: "Day",
            manzil: "Manzil (Review)",
            sabki: "Sabki (Recent)",
            sabak: "Sabak (New)",
            optLines: "lines",
            optHalf: "Half page",
            optFull: "Full page",
            optWeek: "week",
            optMonth: "month",
            quotes: [
                "The best of you are those who learn the Quran and teach it.",
                "Read the Quran, for it will come as an intercessor on the Day of Judgment.",
                "A heart without Quran is like a ruined house.",
                "Quran is a light on earth and a treasure in heaven."
            ]
        },
        ar: {
            title: "план Корана",
            progress: "التقدم",
            lblLang: "اللغة",
            lblQuotes: "إظهار الاقتباسات",
            lblPlanHeader: "إعدادات الخطة",
            lblStartPage: "صفحة البداية",
            lblPace: "المقدار اليومي",
            lblDuration: "المدة",
            btnGenerate: "إنشاء خطة جديدة",
            lblWarning: "⚠️ إنشاء خطة جديدة سيؤدي إلى حذف التقدم الحالي!",
            modalTitle: "الإعدادات",
            days: "اليوم",
            manzil: "المنزل (المراجعة)",
            sabki: "السبقي (الرابط)",
            sabak: "السبق (الدرس الجديد)",
            optLines: "أسطر",
            optHalf: "نصف صفحة",
            optFull: "صفحة كاملة",
            optWeek: "أسبوع",
            optMonth: "شهر",
            quotes: [
                "خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ",
                "اقْرَءُوا الْقُرْآنَ فَإِنَّهُ يَأْتِي يَوْمَ الْقِيَامَةِ شَفِيعًا لِأَصْحَابِهِ",
                "الَّذِي لَيْسَ فِي جَوْفِهِ شَيْءٌ مِنَ الْقُرْآنِ كَالْبَيْتِ الْخَرِبِ",
                "القرآن غنى لا فقر بعده ولا غنى دونه"
            ]
        }
    };

    // --- STATE MANAGEMENT ---
    const DB_KEY = 'quran_app_v3';
    let state = {
        lang: 'ru',
        showQuotes: true,
        setupDone: false,
        settings: { start: 1, pace: 0.5, duration: 30 },
        schedule: [],
        progress: {}
    };

    // --- AUDIO ENGINE (Soft Sounds) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const t = audioCtx.currentTime;

        if (type === 'click') {
            // Soft water droplet sound
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, t);
            osc.frequency.exponentialRampToValueAtTime(300, t + 0.1);
            gain.gain.setValueAtTime(0.15, t); // Lower volume
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.start(t);
            osc.stop(t + 0.12);
        } else if (type === 'success') {
            // Gentle major chord
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, t); // A4
            osc.frequency.linearRampToValueAtTime(554.37, t + 0.1); // C#5
            gain.gain.setValueAtTime(0.05, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.5);
            osc.start(t);
            osc.stop(t + 0.5);
        }
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
    }

    // --- LOGIC ---
    function init() {
        const saved = localStorage.getItem(DB_KEY);
        if (saved) state = JSON.parse(saved);

        // Apply Language
        setLang(state.lang, false);
        
        // Apply Quotes Toggle
        document.getElementById('toggleQuotes').checked = state.showQuotes;
        toggleQuotes(state.showQuotes);

        if (!state.setupDone) {
            openSettings(); // First time -> Force settings
            document.getElementById('mainApp').style.display = 'none'; // Hide app behind modal
        } else {
            document.getElementById('mainApp').style.display = 'block';
            renderSchedule();
        }
    }

    function generatePlan() {
        // Read values from form
        const start = parseInt(document.getElementById('inpStartPage').value);
        const pace = parseFloat(document.getElementById('inpPace').value);
        const duration = parseInt(document.getElementById('inpDuration').value);

        state.settings = { start, pace, duration };
        state.schedule = calculateSchedule(start, pace, duration);
        state.progress = {}; // Reset progress
        state.setupDone = true;

        saveState();
        closeSettings();
        document.getElementById('mainApp').style.display = 'block';
        renderSchedule();
    }

    // Smart Algorithm handles lines vs pages
    function calculateSchedule(startPage, pace, days) {
        let plan = [];
        let currPage = startPage;
        let currLine = 0; // 0 = start of page

        for (let d = 1; d <= days; d++) {
            let manzilTxt = "", sabkiTxt = "", sabakTxt = "";
            let isRest = (d % 7 === 0);

            // 1. MANZIL (Archive)
            if (currPage <= 1) manzilTxt = "---";
            else {
                let mEnd = Math.floor(currPage) - 5;
                if (mEnd < 1) mEnd = 1;
                // Simple logic: Read everything up to 5 pages ago
                if (mEnd > 1) manzilTxt = `1 - ${mEnd}`;
                else manzilTxt = "---";
            }

            // 2. SABKI (Recent 5 pages)
            let sEnd = Math.floor(currPage);
            let sStart = Math.max(1, sEnd - 4);
            sabkiTxt = `${sStart} - ${sEnd}`;

            // 3. SABAK (New)
            if (isRest) {
                sabakTxt = "Jumu'ah / Review"; 
            } else {
                if (pace >= 1) {
                    // Full page mode
                    sabakTxt = `Page ${currPage}`;
                    currPage++;
                } else if (pace === 0.5) {
                    // Half page mode
                    let part = (currLine === 0) ? "Top" : "Bottom";
                    sabakTxt = `Page ${currPage} (${part})`;
                    if (currLine === 0) currLine = 1;
                    else { currLine = 0; currPage++; }
                } else {
                    // Lines mode (3, 5, 7 lines)
                    // Assuming 15 lines per page
                    let endLine = currLine + pace;
                    if (endLine > 15) {
                        sabakTxt = `Pg ${currPage} (L${currLine+1}-15) + Pg ${currPage+1} (L1-${endLine-15})`;
                        currPage++;
                        currLine = endLine - 15;
                    } else {
                        sabakTxt = `Page ${currPage} (Lines ${currLine+1}-${endLine})`;
                        currLine = endLine;
                        if (currLine === 15) { currLine = 0; currPage++; }
                    }
                }
            }

            plan.push({
                d: d,
                m: manzilTxt,
                s: sabkiTxt,
                n: sabakTxt,
                rest: isRest
            });
        }
        return plan;
    }

    function renderSchedule() {
        const list = document.getElementById('scheduleList');
        list.innerHTML = '';
        
        // Update Quote
        if (state.showQuotes) {
            const txt = i18n[state.lang].quotes;
            document.getElementById('quoteText').innerText = txt[Math.floor(Math.random() * txt.length)];
        }

        let completedCount = 0;
        let totalCount = state.schedule.length * 3;
        let firstActive = null;

        state.schedule.forEach((day, idx) => {
            const dayNum = idx + 1;
            const kM = `d${dayNum}_m`, kS = `d${dayNum}_s`, kN = `d${dayNum}_n`;
            
            const doneM = state.progress[kM];
            const doneS = state.progress[kS];
            const doneN = state.progress[kN];

            if (doneM) completedCount++;
            if (doneS) completedCount++;
            if (doneN) completedCount++;

            const isDayDone = doneM && doneS && doneN;

            // Day Card
            const card = document.createElement('div');
            card.className = `day-card ${isDayDone ? 'completed' : ''}`;
            if (!isDayDone && !firstActive) {
                firstActive = card;
                card.classList.add('active-day');
            }

            // Translation helpers
            const t = i18n[state.lang];

            card.innerHTML = `
                <div class="day-header">
                    <span>${t.days} ${day.d}</span>
                    <span style="font-size:14px; opacity:0.7">${day.rest ? '☕️' : ''}</span>
                </div>
                
                <div class="task-row ${doneM ? 'checked' : ''}" onclick="toggle('${kM}')">
                    <div class="checkbox">${doneM ? '✓' : ''}</div>
                    <div class="task-meta">
                        <span class="task-label type-manzil">${t.manzil}</span>
                        <span class="task-desc">${day.m}</span>
                    </div>
                </div>

                <div class="task-row ${doneS ? 'checked' : ''}" onclick="toggle('${kS}')">
                    <div class="checkbox">${doneS ? '✓' : ''}</div>
                    <div class="task-meta">
                        <span class="task-label type-sabki">${t.sabki}</span>
                        <span class="task-desc">${day.s}</span>
                    </div>
                </div>

                <div class="task-row ${doneN ? 'checked' : ''}" onclick="toggle('${kN}')">
                    <div class="checkbox">${doneN ? '✓' : ''}</div>
                    <div class="task-meta">
                        <span class="task-label type-sabak">${t.sabak}</span>
                        <span class="task-desc">${day.n}</span>
                    </div>
                </div>
            `;
            list.appendChild(card);
        });

        // Update Progress Bar
        const percent = Math.round((completedCount / totalCount) * 100);
        document.getElementById('progressBar').style.width = `${percent}%`;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('progressLabel').innerText = i18n[state.lang].progress;

        // Auto Scroll
        if (firstActive) {
            setTimeout(() => firstActive.scrollIntoView({behavior: 'smooth', block: 'center'}), 300);
        }
    }

    function toggle(key) {
        if (state.progress[key]) {
            delete state.progress[key];
        } else {
            state.progress[key] = true;
            playSound('click');
        }
        
        // Check day completion logic could be added here for 'success' sound
        const dayPrefix = key.split('_')[0];
        if (state.progress[`${dayPrefix}_m`] && state.progress[`${dayPrefix}_s`] && state.progress[`${dayPrefix}_n`]) {
            if (!state.progress[key]) { /* Prevent double sound on uncheck */ }
            else { playSound('success'); }
        }

        saveState();
        renderSchedule();
    }

    // --- UI HELPERS ---
    function openSettings() {
        document.getElementById('settingsModal').classList.add('open');
        // Pre-fill inputs from state
        document.getElementById('inpStartPage').value = state.settings.start;
        document.getElementById('inpPace').value = state.settings.pace;
        document.getElementById('inpDuration').value = state.settings.duration;
    }

    function closeSettings() {
        document.getElementById('settingsModal').classList.remove('open');
    }

    function setLang(lang, render = true) {
        state.lang = lang;
        const t = i18n[lang];
        
        // Update Buttons
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        if (lang === 'ru') document.getElementById('btnRu').classList.add('active');
        if (lang === 'en') document.getElementById('btnEn').classList.add('active');
        if (lang === 'ar') document.getElementById('btnAr').classList.add('active');

        // RTL Support
        document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';

        // Update Text in Modal
        document.getElementById('lblLang').innerText = t.lblLang;
        document.getElementById('lblQuotes').innerText = t.lblQuotes;
        document.getElementById('lblPlanHeader').innerText = t.lblPlanHeader;
        document.getElementById('lblStartPage').innerText = t.lblStartPage;
        document.getElementById('lblPace').innerText = t.lblPace;
        document.getElementById('lblDuration').innerText = t.lblDuration;
        document.getElementById('btnGenerate').innerText = t.btnGenerate;
        document.getElementById('lblWarning').innerText = t.lblWarning;
        document.getElementById('modalTitle').innerText = t.modalTitle;

        if (render) {
            saveState();
            renderSchedule();
        }
    }

    function toggleQuotes(isChecked) {
        state.showQuotes = isChecked;
        const card = document.getElementById('quoteCard');
        if (isChecked) {
            card.classList.remove('hidden');
            renderSchedule(); // Refresh text
        } else {
            card.classList.add('hidden');
        }
        saveState();
    }

    function saveState() {
        localStorage.setItem(DB_KEY, JSON.stringify(state));
    }

    // Init App
    init();

</script>
</body>
</html>
