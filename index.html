<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#047857">
    <title>Hifz Tracker (Abu Adel)</title>
    
    <!-- Шрифты: Amiri для арабского, Inter для интерфейса -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #064e3b;
            --bg: #f0fdf4;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-sec: #4b5563;
            --border: #e5e7eb;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            
            /* Цвета статусов */
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --surface: #1f2937;
                --text-main: #f9fafb;
                --text-sec: #9ca3af;
                --border: #374151;
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0; padding: 20px;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- КОМПОНЕНТЫ --- */
        
        /* 1. Шапка и Цитата */
        header { margin-bottom: 25px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); }
        .btn-icon { background: var(--surface); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 10px; font-size: 18px; cursor: pointer; }

        .quote-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .quote-text { font-size: 15px; line-height: 1.6; font-weight: 500; position: relative; z-index: 2; }
        .quote-ref { font-size: 12px; margin-top: 10px; opacity: 0.8; font-style: italic; }
        .quote-icon { position: absolute; right: -10px; bottom: -20px; font-size: 80px; opacity: 0.1; transform: rotate(-15deg); }

        /* 2. Тепловая карта (Heatmap) */
        .heatmap-box {
            background: var(--surface); padding: 15px; border-radius: var(--radius);
            border: 1px solid var(--border); margin-bottom: 25px;
        }
        .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-sec); margin-bottom: 10px; font-weight: 700; }
        .heatmap-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; }
        .heat-cell { aspect-ratio: 1; background: var(--border); border-radius: 4px; }
        .h-l1 { background: #6ee7b7; } .h-l2 { background: #10b981; } .h-l3 { background: #047857; }

        /* 3. Карточка Дня */
        .day-card {
            background: var(--surface); padding: 20px; border-radius: var(--radius);
            box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border);
        }
        .day-header { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .day-title { font-weight: 800; font-size: 18px; color: var(--primary); }

        /* Задачи */
        .task-item { margin-bottom: 15px; }
        .task-meta { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .task-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
        
        .tag-manzil { background: #ffedd5; color: #c2410c; }
        .tag-sabki { background: #e0f2fe; color: #0369a1; }
        .tag-sabak { background: #d1fae5; color: #047857; }

        .task-val { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        
        .rating-row { display: flex; gap: 8px; }
        .btn-rate { flex: 1; border: none; padding: 8px; border-radius: 8px; font-size: 18px; cursor: pointer; opacity: 0.3; filter: grayscale(1); transition: 0.2s; }
        .btn-rate.active { opacity: 1; filter: grayscale(0); transform: scale(1.05); }
        
        .r-green { background: var(--green); color: white; }
        .r-yellow { background: var(--yellow); color: white; }
        .r-red { background: var(--red); color: white; }

        .btn-mushaf { background: var(--text-main); color: var(--surface); width: 30px; height: 20px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-left: 10px; }

        /* 4. Модальные окна */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 1000; display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            background: var(--surface); width: 90%; max-width: 500px;
            padding: 25px; border-radius: 20px; max-height: 90vh; overflow-y: auto;
            animation: slideUp 0.3s;
        }
        
        /* Элементы форм */
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--text-sec); }
        select, input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text-main); font-size: 16px; box-sizing: border-box; }
        .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Картинка Мусхафа */
        .mushaf-img { width: 100%; border-radius: 8px; }

    </style>
</head>
<body>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div class="container">
    <header>
        <div class="top-bar">
            <div class="logo">QuranHifz</div>
            <button class="btn-icon" onclick="openModal('settingsModal')">⚙️</button>
        </div>
        
        <!-- Цитата (Абу Адель) -->
        <div class="quote-card" id="quoteCard">
            <div class="quote-icon">📖</div>
            <div class="quote-text" id="quoteText">Загрузка...</div>
            <div class="quote-ref" id="quoteRef"></div>
        </div>
    </header>

    <!-- Тепловая карта -->
    <div class="heatmap-box">
        <div class="section-title">Активность (30 дней)</div>
        <div class="heatmap-grid" id="heatmapGrid"></div>
    </div>

    <!-- Список задач -->
    <div id="scheduleList"></div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: НАСТРОЙКИ -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
        <h2 style="margin-top:0;">Настройки плана</h2>
        
        <label>Язык приложения</label>
        <select id="inpLang" onchange="changeLang(this.value)">
            <option value="ru">Русский</option>
            <option value="en">English</option>
        </select>

        <label>С какой страницы начать?</label>
        <input type="number" id="inpStart" value="1" min="1" max="604">

        <label>Темп заучивания</label>
        <select id="inpPace">
            <option value="0.5">Половина страницы (7 строк)</option>
            <option value="1">Целая страница (15 строк)</option>
            <option value="5">5 строк</option>
        </select>

        <label>Длительность цикла</label>
        <select id="inpDuration">
            <option value="14">2 недели</option>
            <option value="30">1 месяц</option>
        </select>

        <button class="btn-primary" onclick="generatePlan()">Создать новый план</button>
        <p style="text-align:center; font-size:12px; color:#ef4444; margin-top:10px;">⚠️ Создание плана сбросит текущий прогресс</p>
        <p style="text-align:center; font-size:12px; color:#6b7280; margin-top:10px; cursor:pointer" onclick="closeModal('settingsModal')">Закрыть</p>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: МУСХАФ -->
<div class="modal-overlay" id="mushafModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <h3>Мусхаф</h3>
            <button onclick="closeModal('mushafModal')" style="background:none; border:none; font-size:20px;">✕</button>
        </div>
        <div id="mushafContainer" style="min-height:200px; display:flex; align-items:center; justify-content:center;">
            Загрузка...
        </div>
        <p style="text-align:center; font-size:12px; color:gray; margin-top:10px;">Мединский шрифт</p>
    </div>
</div>

<script>
    // --- БАЗА ЦИТАТ (ТОЛЬКО АБУ АДЕЛЬ) ---
    const quotesAbuAdel = [
        {
            text: "И Мы уже облегчили Коран для запоминания [поминания], но найдется ли вспоминающий [кто усвоит наставления и поучения]?",
            ref: "Сура Аль-Камар (54:17), пер. Абу Адель"
        },
        {
            text: "Или добавь к нему [к половине ночи] (немного) и читай Коран размеренно [не спеша и чётко произнося буквы].",

        },

        {

            ref: "Сура Та Ха (20:114), пер. Абу Адель"
        }
    ];

    const i18n = {
        ru: {
            manzil: "Манзиль (Архив)",
            sabki: "Сабки (Связка)",
            sabak: "Сабак (Новый урок)",
            days: "День",
            activity: "Активность",
            view: "Открыть",
            desc_m: "Повторение старых страниц",
            desc_s: "Повторение последних 5 страниц",
            desc_n: "Заучивание новой части"
        },
        en: {
            manzil: "Manzil (Archive)",
            sabki: "Sabki (Recent)",

            days: "Day",
            activity: "Activity",
            view: "View",
            desc_m: "Review old memorized pages",
            desc_s: "Review last 5 pages",
            desc_n: "Memorize new part"
        }
    };

    // --- СОСТОЯНИЕ (STATE) ---
    const DB_KEY = 'hifz_abu_adel_v1';
    let state = {
        lang: 'ru',
        settings: { start: 1, pace: 0.5, duration: 30 },
        schedule: [],
        progress: {}, // { "d1_m": 3 } 1=red, 2=yellow, 3=green
        history: {} // "YYYY-MM-DD": count
    };

    function init() {
        const saved = localStorage.getItem(DB_KEY);
        if (saved) state = JSON.parse(saved);
